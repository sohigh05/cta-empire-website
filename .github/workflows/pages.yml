# Terbitkan kandungan folder dist ke GitHub Pages.
name: Terbitkan CTA EMPIRE

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kod website
        uses: actions/checkout@v6

      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Muat naik fail website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v4
